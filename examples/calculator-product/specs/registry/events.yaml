schemaVersion: 1
# Canonical event registry. Feature `events:` entries and scenario event
# assertions must resolve here (validation Pass 5).
events:
  - id: calculator.calculation.completed
    owner: calculator-team
    description: >-
      Emitted exactly once per successful calculation. The payload identifies
      the governing Rule and never contains raw request headers.

  - id: calculator.calculation.rejected
    owner: calculator-team
    description: >-
      Emitted exactly once per rejected calculation. The payload carries the
      stable public error code and never contains raw request headers.
