schemaVersion: 3

workspace:
  name: shopping-cart-product
  root: .

specifications:
  features: [specs/features/**/*.feature]
  epics: [specs/epics/**/*.yaml]
  controls: [specs/controls/**/*.yaml]
  registries: [specs/registry/**/*.yaml]

targets:
  flutter:
    language: dart
    framework: flutter
    packages:
      - id: shopping-cart
        path: .
        roots: [lib, test]
    contractOutput: lib/src/generated
    extractor: zuke-dart-resolved

dartTooling:
  extraction:
    authority: cli
    cache: .zuke/cache/dart
    requireResolvedAnnotations: true
    rejectIncompleteFragments: true
  analyzerPlugin:
    enabled: true
  buildHooks:
    default: disabled
    enabledPackages: [.]
  generation:
    driver: zuke-cli
    commitGeneratedSource: true
    watchCommand: dart run zuke_cli:zuke watch --generate --validate

policies:
  preset: secure-product-v1
  project: policies/project-policy.yaml
  profiles: [policies/security-profiles.yaml]
  protectedSeverities:
    duplicateId: error
    ambiguousBinding: error
    missingSecurityEvidence: error
    staleLock: error

execution:
  runners:
    - id: shopping-flutter-tests
      kind: gherkin
      target: flutter
      sourcePackage: shopping-cart
      sourceAdapter: dart-source
      sourceCompatibilityId: dart-source-package-v1
      runnerCompatibilityId: shopping-cart-flutter-runner-v1
      evidenceTypes: [gherkin-ui]
      executable: flutter
      args: [test, --no-pub, --reporter, expanded]
      workingDirectory: .
      generatedStepsOutput: test/support/generated
      timeoutSeconds: 300
  pullRequest:
    tagExpression: '@pr'
  merge:
    tagExpression: '@pr or @merge'
  release:
    tagExpression: '@pr or @release'

evidence:
  output: generated/evidence/records
  records: generated/evidence/records
  observations: generated/evidence/runs
  includeSourceCode: false
  types:
    gherkin-ui: {mode: record}

trust:
  bundle: assurance-history/trust/ed25519.json
  algorithm: ed25519

lock:
  directory: assurance/locks
  profiles: [pullRequest, merge, release, nightly]
  requireCleanGeneration: true
