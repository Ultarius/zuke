name: zuke_cli
description: Command-line tooling for validating, generating, extracting, and verifying Zuke specifications and assurance evidence.
version: 0.5.0
environment:
  sdk: '>=3.10.0 <4.0.0'
resolution: workspace
dependencies:
  args: ^2.6.0
  yaml: ^3.1.2
  yaml_edit: ^2.2.4
  glob: ^2.1.2
  crypto: ^3.0.6
  analyzer: '>=8.2.0 <15.0.0'
  dart_frog_gen: ^2.1.0
  path: ^1.9.1
  zuke_core: ^0.4.0
  zuke_frontend: ^0.2.2
  zuke: ^0.4.0
  dart_style: ^3.1.3

dev_dependencies:
  test: ^1.24.0
  cryptography: ^2.7.0
  zuke_http_runtime: ^0.1.1

executables:
  zuke: zuke
repository: https://github.com/Ultarius/zuke
issue_tracker: https://github.com/Ultarius/zuke/issues
documentation: https://github.com/Ultarius/zuke/blob/main/docs/integration-guide.md
topics:
  - zuke
  - gherkin
  - bdd
