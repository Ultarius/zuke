name: zuke_analyzer
description: Zuke resolved annotation diagnostics for Dart analysis.
version: 0.1.0
environment:
  sdk: '>=3.10.0 <4.0.0'
resolution: workspace
publish_to: none
dependencies:
  analysis_server_plugin: ^0.3.8
  analyzer: '>=10.0.0 <15.0.0'
  # Path so the isolated analysis-server plugin package sees workspace
  # ZukeIndex (verifiedRequirementIds), not a stale pub.dev release.
  zuke_cli:
    path: ../zuke_cli

dev_dependencies:
  test: ^1.24.0
  zuke_test_support: any
repository: https://github.com/Ultarius/zuke
issue_tracker: https://github.com/Ultarius/zuke/issues
documentation: https://github.com/Ultarius/zuke/blob/main/docs/integration-guide.md
topics:
  - zuke
  - gherkin
  - bdd
