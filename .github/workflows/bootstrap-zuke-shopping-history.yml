name: bootstrap-zuke-shopping-history

# Create the first trusted shopping-cart V2 record through the existing release
# signing environment and open a reviewable PR containing the signed record.
on:
  workflow_dispatch:
  push:
    tags: ['zuke-assurance-bootstrap-shopping-*']

jobs:
  sign-genesis:
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: dart --suppress-analytics pub get
      - name: Prepare Flutter tool package
        run: dart --suppress-analytics run tool/prepare_flutter_toolchain.dart
      - name: Produce verified shopping evidence and lock
        run: |
          dart --suppress-analytics run zuke_cli:zuke generate --root examples/shopping_cart --check
          dart --suppress-analytics run zuke_cli:zuke test --root examples/shopping_cart --profile release
          dart --suppress-analytics run zuke_cli:zuke validate --root examples/shopping_cart --profile release --format json
          dart --suppress-analytics run zuke_cli:zuke lock --root examples/shopping_cart --profile release --check
      - name: Obtain short-lived signer token through GitHub OIDC
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ZUKE_SIGNING_PROVIDER_AUDIENCE: ${{ vars.ZUKE_SIGNING_PROVIDER_AUDIENCE }}
          ZUKE_SIGNING_PROVIDER_URL: ${{ vars.ZUKE_SIGNING_PROVIDER_URL }}
        run: |
          : "${AZURE_CLIENT_ID:?release-signing AZURE_CLIENT_ID is required}"
          : "${AZURE_TENANT_ID:?release-signing AZURE_TENANT_ID is required}"
          : "${ZUKE_SIGNING_PROVIDER_AUDIENCE:?release-signing ZUKE_SIGNING_PROVIDER_AUDIENCE is required}"
          : "${ZUKE_SIGNING_PROVIDER_URL:?release-signing ZUKE_SIGNING_PROVIDER_URL is required}"
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange"
          oidc_token="$(curl --fail-with-body -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$oidc_url" | jq -r .value)"
          az login --service-principal --tenant "$AZURE_TENANT_ID" --username "$AZURE_CLIENT_ID" --federated-token "$oidc_token" --allow-no-subscriptions >/dev/null
          signer_token="$(az account get-access-token --resource "$ZUKE_SIGNING_PROVIDER_AUDIENCE" --query accessToken --output tsv)"
          echo "::add-mask::$signer_token"
          echo "ZUKE_SIGNING_PROVIDER_URL=$ZUKE_SIGNING_PROVIDER_URL" >> "$GITHUB_ENV"
          echo "ZUKE_SIGNING_PROVIDER_BEARER_TOKEN=$signer_token" >> "$GITHUB_ENV"
      - name: Create and verify genesis release record
        env:
          SIGNER_KEY_ID: ${{ vars.RELEASE_SIGNER_KEY_ID || 'default' }}
        run: |
          dart --suppress-analytics run zuke_cli:zuke manifest create --root examples/shopping_cart --profile release --signer-id shopping-cart-release-signer-v1 --key-id "$SIGNER_KEY_ID"
          dart --suppress-analytics run zuke_cli:zuke manifest verify-v2 --root examples/shopping_cart --current
          dart --suppress-analytics run zuke_cli:zuke manifest export --root examples/shopping_cart --output dist/zuke-shopping-cart-assurance-history.v2.json
      - name: Open PR with signed shopping history
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          branch='automation/zuke-shopping-assurance-history'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add examples/shopping_cart/assurance-history/v2
          if git diff --cached --quiet; then
            echo 'No signed shopping history record was generated.' >&2
            exit 1
          fi
          git commit -m 'chore: add signed shopping cart assurance genesis'
          git fetch origin "$branch" || true
          git push --force-with-lease origin "HEAD:$branch"
          pr_number="$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')"
          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" \
              --title 'chore: add signed shopping cart assurance genesis' \
              --body 'This PR adds the first Zuke V2 signed assurance record for the shopping-cart example. It was produced through the release-signing OIDC workflow.'
          else
            gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$branch" \
              --title 'chore: add signed shopping cart assurance genesis' \
              --body 'This PR adds the first Zuke V2 signed assurance record for the shopping-cart example. It was produced through the release-signing OIDC workflow.'
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zuke-shopping-cart-genesis-history
          retention-days: 30
          path: |
            examples/shopping_cart/assurance-history/v2/
            dist/zuke-shopping-cart-assurance-history.v2.json
