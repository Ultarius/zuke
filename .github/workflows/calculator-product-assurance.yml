name: calculator-product-assurance

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      profile:
        description: Zuke assurance profile to execute.
        required: true
        type: string
      prepare_lock:
        description: Build a fresh profile lock before checking the workspace.
        required: false
        default: false
        type: boolean
      demonstrate_rate_limit:
        description: Add the local calculator rate-limit demonstration to the summary.
        required: false
        default: true
        type: boolean

jobs:
  calculator:
    name: calculator checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      ZUKE_RUN_PROCESS_INTEGRATION: 'true'
    steps:
      - name: Check out repository for local action resolution
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-zuke
      - name: Verify zuke_core with published analyzer resolution
        run: dart --suppress-analytics run tool/check_zuke_core_analyzer14.dart
      - name: Prepare Flutter tool package
        run: dart --suppress-analytics run tool/prepare_flutter_toolchain.dart
      - run: dart --suppress-analytics format --output=none --set-exit-if-changed vendor-sdk examples/calculator-product
      - run: dart --suppress-analytics run melos run docs:check
      # Serialize analyze: concurrent dart analyze processes race when
      # building the shared analyzer-plugin AOT snapshot under
      # ~/.dartServer/.plugin_manager (truncated plugin.aot, exit 4).
      - run: dart --suppress-analytics run melos exec --no-flutter --concurrency=1 -- dart --suppress-analytics analyze --fatal-infos
      - run: flutter --suppress-analytics analyze examples/calculator-product/apps/calculator_mobile --fatal-infos
      - run: flutter --suppress-analytics test
        working-directory: examples/calculator-product/apps/calculator_mobile
      - run: dart --suppress-analytics analyze --fatal-infos
        working-directory: examples/calculator-product/apps/calculator_api
      - name: Missing-lock regression
        run: dart --suppress-analytics test vendor-sdk/zuke_cli/test/lock_missing_probe_test.dart
      - name: Demonstrate local calculator rate limiting
        if: ${{ inputs.demonstrate_rate_limit }}
        working-directory: examples/calculator-product/apps/calculator_api
        run: dart --suppress-analytics run bin/rate_limit_demo.dart
      # With prepare_lock, check writes the lock from its own run and then
      # verifies it, so the assurance pipeline runs once.
      - name: Check ${{ inputs.profile }} assurance
        run: dart --suppress-analytics run zuke_cli:zuke check --root examples/calculator-product --profile ${{ inputs.profile }} --jobs 1 --format json${{ inputs.prepare_lock && ' --prepare-lock' || '' }}
      - run: dart --suppress-analytics run zuke_cli:zuke manifest verify --root examples/calculator-product
      - name: Coverage check
        env:
          # The cli-tests job owns the CLI suite.
          ZUKE_TEST_SCOPE: non-cli
        shell: pwsh
        run: |
          # On macOS the analyzer-heavy coverage tests use the runner's
          # processor count. The other hosts keep their existing budgets.
          if (-not $IsMacOS) {
            $env:ZUKE_TEST_WORKERS = '8'
            $env:ZUKE_TEST_PACKAGE_SLOTS = if ($IsWindows) { '2' } else { '4' }
          }
          dart --suppress-analytics run melos run coverage:check
      - name: Upload assurance artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: zuke-calculator-product-assurance-${{ matrix.os }}
          path: |
            examples/calculator-product/generated/
            examples/calculator-product/assurance/locks/${{ inputs.profile }}.lock.json
            examples/calculator-product/assurance-history/
            vendor-sdk/*/coverage/lcov.info
            examples/calculator-product/**/coverage/lcov.info
      - name: Clean Zuke test temporary directories
        if: always()
        run: dart --suppress-analytics run zuke_cli:zuke clean --root .

  cli-tests:
    name: CLI tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      ZUKE_RUN_PROCESS_INTEGRATION: 'true'
    steps:
      - name: Check out repository for local action resolution
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-zuke
      - name: Prepare Flutter tool package
        run: dart --suppress-analytics run tool/prepare_flutter_toolchain.dart
      # No coverage: no gate reads zuke_cli coverage. The 3-vCPU macOS
      # runner keeps one worker; the 4-vCPU runners use two.
      - name: Run the CLI suite
        env:
          ZUKE_TEST_SCOPE: cli
          ZUKE_TEST_WORKERS: ${{ matrix.os == 'macos-latest' && '1' || '2' }}
        run: dart --suppress-analytics run vendor-sdk/run_dart_tests.dart
      - name: Clean Zuke test temporary directories
        if: always()
        run: dart --suppress-analytics run zuke_cli:zuke clean --root .

  verify:
    # Retain the existing check names. Each check requires both matrices
    # to complete successfully across all platforms.
    name: verify (${{ matrix.os }})
    needs: [calculator, cli-tests]
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest, windows-latest]
    runs-on: ubuntu-26.04
    steps:
      - name: Require calculator checks and CLI tests
        env:
          CALCULATOR_RESULT: ${{ needs.calculator.result }}
          CLI_TESTS_RESULT: ${{ needs.cli-tests.result }}
        run: |
          printf 'Calculator checks: %s\nCLI tests: %s\n' "$CALCULATOR_RESULT" "$CLI_TESTS_RESULT"
          test "$CALCULATOR_RESULT" = success && test "$CLI_TESTS_RESULT" = success
