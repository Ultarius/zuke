name: calculator-product-assurance

on:
  workflow_call:
    inputs:
      profile:
        description: Zuke assurance profile to execute.
        required: true
        type: string
      prepare_lock:
        description: Build a fresh profile lock before checking the workspace.
        required: false
        default: false
        type: boolean
      demonstrate_rate_limit:
        description: Add the local calculator rate-limit demonstration to the summary.
        required: false
        default: true
        type: boolean

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      ZUKE_RUN_PROCESS_INTEGRATION: 'true'
      # The workspace runner caps concurrency at four packages. A budget of
      # eight gives four-package runs two isolates each; later packages queue
      # instead of reducing that per-package budget on slower hosted runners.
      ZUKE_TEST_WORKERS: '8'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: dart --suppress-analytics pub get
      - name: Verify zuke_core with published analyzer resolution
        run: dart --suppress-analytics run tool/check_zuke_core_analyzer14.dart
      - name: Prepare Flutter tool package
        run: dart --suppress-analytics run tool/prepare_flutter_toolchain.dart
      - run: dart --suppress-analytics format --output=none --set-exit-if-changed vendor-sdk examples/calculator-product
      - run: dart --suppress-analytics run melos run docs:check
      - run: dart --suppress-analytics run melos exec --no-flutter -- dart --suppress-analytics analyze
      - run: flutter --suppress-analytics analyze examples/calculator-product/apps/calculator_mobile
      - run: flutter --suppress-analytics test
        working-directory: examples/calculator-product/apps/calculator_mobile
      - run: dart --suppress-analytics analyze
        working-directory: examples/calculator-product/apps/calculator_api
      - name: Missing-lock regression
        run: dart --suppress-analytics test vendor-sdk/zuke_cli/test/lock_missing_probe_test.dart
      - name: Demonstrate local calculator rate limiting
        if: ${{ inputs.demonstrate_rate_limit }}
        working-directory: examples/calculator-product/apps/calculator_api
        run: dart --suppress-analytics run bin/rate_limit_demo.dart
      - name: Prepare ${{ inputs.profile }} assurance lock
        if: ${{ inputs.prepare_lock }}
        run: |
          dart --suppress-analytics run zuke_cli:zuke generate --root examples/calculator-product --check
          dart --suppress-analytics run zuke_cli:zuke test --root examples/calculator-product --profile ${{ inputs.profile }}
          dart --suppress-analytics run zuke_cli:zuke validate --root examples/calculator-product --profile ${{ inputs.profile }} --format json
          dart --suppress-analytics run zuke_cli:zuke lock --root examples/calculator-product --profile ${{ inputs.profile }}
      - run: dart --suppress-analytics run zuke_cli:zuke check --root examples/calculator-product --profile ${{ inputs.profile }} --jobs 1 --format json
      - run: dart --suppress-analytics run zuke_cli:zuke manifest verify-v2 --root examples/calculator-product
      - name: Coverage check
        run: dart --suppress-analytics run melos run coverage:check
      - name: Upload assurance artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: zuke-calculator-product-assurance-${{ matrix.os }}
          path: |
            examples/calculator-product/generated/
            examples/calculator-product/zuke.lock.json
            examples/calculator-product/assurance-history/
            vendor-sdk/*/coverage/lcov.info
            examples/calculator-product/**/coverage/lcov.info
