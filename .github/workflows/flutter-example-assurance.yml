name: flutter-example-assurance

on:
  workflow_call:
    inputs:
      profile:
        required: true
        type: string
      changed-since:
        required: true
        type: string
      example-root:
        required: true
        type: string
      package-name:
        required: true
        type: string
      require-history:
        description: Require a non-empty signed history; false still validates the configured chain policy.
        required: true
        type: boolean

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      ZUKE_RUN_PROCESS_INTEGRATION: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter --suppress-analytics pub get
      - name: Prepare Flutter tool package
        run: dart --suppress-analytics run tool/prepare_flutter_toolchain.dart
      - name: Flutter launcher integration
        run: dart --suppress-analytics test vendor-sdk/zuke_cli/test/flutter_toolchain_integration_test.dart
      - name: Process-tree integration test
        run: dart --suppress-analytics test vendor-sdk/zuke_cli/test/process_supervisor_integration_test.dart
      - run: dart --suppress-analytics format --output=none --set-exit-if-changed lib test
        working-directory: ${{ inputs.example-root }}
      - run: flutter --suppress-analytics analyze --no-pub
        working-directory: ${{ inputs.example-root }}
      - run: flutter --suppress-analytics test --no-pub --coverage
        working-directory: ${{ inputs.example-root }}
      - run: dart --suppress-analytics run vendor-sdk/check_coverage.dart --package ${{ inputs.package-name }} --format=json --output ${{ inputs.example-root }}/generated/coverage/summary.json
      - run: dart --suppress-analytics run zuke_cli:zuke doctor --root ${{ inputs.example-root }}
      - run: dart --suppress-analytics run zuke_cli:zuke check --root ${{ inputs.example-root }} --profile ${{ inputs.profile }} --jobs 1 --format json
      - run: dart --suppress-analytics run zuke_cli:zuke affected --root ${{ inputs.example-root }} --changed-since ${{ inputs.changed-since }}
      - name: Verify assurance history policy
        run: >-
          dart --suppress-analytics run zuke_cli:zuke manifest verify
          --root ${{ inputs.example-root }}
          ${{ inputs.require-history && '--require-history' || '' }}
      - run: git diff --exit-code -- ${{ inputs.example-root }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ${{ inputs.package-name }}-assurance-${{ matrix.os }}
          path: |
            ${{ inputs.example-root }}/generated/
            ${{ inputs.example-root }}/assurance/locks/${{ inputs.profile }}.lock.json
            ${{ inputs.example-root }}/assurance-history/
            ${{ inputs.example-root }}/generated/coverage/
      - name: Clean Zuke test temporary directories
        if: always()
        run: dart --suppress-analytics run zuke_cli:zuke clean --root .
