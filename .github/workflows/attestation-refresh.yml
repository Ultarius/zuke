name: refresh gateway attestation

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

concurrency:
  group: gateway-attestation-refresh
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: attestation-refresh
    env:
      APIM_SUBSCRIPTION_ID: ${{ vars.APIM_SUBSCRIPTION_ID }}
      APIM_RESOURCE_GROUP: ${{ vars.APIM_RESOURCE_GROUP }}
      APIM_SERVICE_NAME: ${{ vars.APIM_SERVICE_NAME }}
      APIM_API_ID: ${{ vars.APIM_API_ID }}
      APIM_OPERATION_ID: ${{ vars.APIM_OPERATION_ID }}
      APIM_PRODUCT_ID: ${{ vars.APIM_PRODUCT_ID }}
      GATEWAY_EVIDENCE_STORAGE_ACCOUNT: ${{ vars.GATEWAY_EVIDENCE_STORAGE_ACCOUNT }}
      GATEWAY_EVIDENCE_CONTAINER: assurance-evidence
      GATEWAY_REFERENCE: EDGE-POLICY-2841
      GATEWAY_ROUTE: /v1/calculations/**
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ZUKE_SIGNING_PROVIDER_URL: ${{ vars.ZUKE_SIGNING_PROVIDER_URL }}
      ZUKE_SIGNING_PROVIDER_AUDIENCE: ${{ vars.ZUKE_SIGNING_PROVIDER_AUDIENCE }}
      ATTESTATION_SIGNER_KEY_ID: ${{ vars.ATTESTATION_SIGNER_KEY_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Authenticate to Azure with the environment-bound OIDC identity
        shell: bash
        run: |
          : "${AZURE_CLIENT_ID:?attestation-refresh AZURE_CLIENT_ID is required}"
          : "${AZURE_TENANT_ID:?attestation-refresh AZURE_TENANT_ID is required}"
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange"
          oidc_token="$(curl --fail-with-body -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$oidc_url" | jq -r .value)"
          test -n "$oidc_token" && test "$oidc_token" != null
          az login --service-principal --tenant "$AZURE_TENANT_ID" --username "$AZURE_CLIENT_ID" --federated-token "$oidc_token" --allow-no-subscriptions >/dev/null
      - name: Export every APIM policy scope and current revision metadata
        shell: bash
        run: |
          set -euo pipefail
          : "${APIM_SUBSCRIPTION_ID:?APIM_SUBSCRIPTION_ID is required}"
          : "${APIM_RESOURCE_GROUP:?APIM_RESOURCE_GROUP is required}"
          : "${APIM_SERVICE_NAME:?APIM_SERVICE_NAME is required}"
          : "${APIM_API_ID:?APIM_API_ID is required}"
          : "${APIM_OPERATION_ID:?APIM_OPERATION_ID is required}"
          : "${APIM_PRODUCT_ID:?APIM_PRODUCT_ID is required}"
          base="https://management.azure.com/subscriptions/${APIM_SUBSCRIPTION_ID}/resourceGroups/${APIM_RESOURCE_GROUP}/providers/Microsoft.ApiManagement/service/${APIM_SERVICE_NAME}"
          api_version='2024-05-01'
          policy() { az rest --method get --url "$1?api-version=${api_version}&format=rawxml" --query properties.value --output tsv; }
          service_policy="$(policy "${base}/policies/policy")"
          product_policy="$(policy "${base}/products/${APIM_PRODUCT_ID}/policies/policy")"
          api_policy="$(policy "${base}/apis/${APIM_API_ID}/policies/policy")"
          operation_policy="$(policy "${base}/apis/${APIM_API_ID}/operations/${APIM_OPERATION_ID}/policies/policy")"
          api_metadata="$(az rest --method get --url "${base}/apis/${APIM_API_ID}?api-version=${api_version}")"
          product_apis="$(az rest --method get --url "${base}/products/${APIM_PRODUCT_ID}/apis?api-version=${api_version}")"
          api_in_product="$(jq --arg api "/apis/${APIM_API_ID}" '[.value[]?.id | endswith($api)] | any' <<<"$product_apis")"
          has_rate_limit=false
          if grep -Eq '<rate-limit(-by-key)?([[:space:]>])' <<<"${service_policy}${product_policy}${api_policy}${operation_policy}"; then
            has_rate_limit=true
          fi
          current_revision="$(jq -r '.properties.apiRevision // empty' <<<"$api_metadata")"
          revision_is_current=false
          if test -n "$current_revision" && test "$APIM_API_ID" != *';rev='*; then
            revision_is_current=true
          fi
          policy_attached=false
          if test "$api_in_product" = true && test "$has_rate_limit" = true; then
            policy_attached=true
          fi
          jq -n \
            --arg route "$GATEWAY_ROUTE" \
            --arg service "$service_policy" --arg product "$product_policy" \
            --arg api "$api_policy" --arg operation "$operation_policy" \
            --argjson apiMetadata "$api_metadata" \
            --arg workflowRun "$GITHUB_RUN_ID" --arg sourceCommit "$GITHUB_SHA" \
            --argjson policyAttached "$policy_attached" \
            --argjson currentRevision "$revision_is_current" \
            '{route:$route, gateway:{resourceId:env.APIM_SERVICE_NAME}, api:{resourceId:env.APIM_API_ID, revision:$apiMetadata.properties.apiRevision, etag:$apiMetadata.etag}, policies:{service:$service,product:$product,api:$api,operation:$operation}, verification:{policyAttached:$policyAttached,inheritanceResolved:false,currentRevision:$currentRevision}, exportedAt:now|todate, exporter:{workflowRunId:$workflowRun,sourceCommit:$sourceCommit}}' > raw-apim-export.json
      - name: Canonicalize and retain exact evidence bytes
        shell: bash
        run: |
          set -euo pipefail
          dart --suppress-analytics pub get
          dart --suppress-analytics run zuke_cli:zuke gateway canonicalize-apim \
            --input raw-apim-export.json --output gateway-policy-export.json \
            --route "$GATEWAY_ROUTE" --reference "$GATEWAY_REFERENCE"
          digest="$(sha256sum gateway-policy-export.json | awk '{print $1}')"
          test "$digest" != e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
          az storage blob upload --auth-mode login --account-name "$GATEWAY_EVIDENCE_STORAGE_ACCOUNT" \
            --container-name "$GATEWAY_EVIDENCE_CONTAINER" --name "gateway-policy/sha256/${digest}.json" \
            --file gateway-policy-export.json --overwrite false \
            --metadata sha256="sha256:${digest}" reference="$GATEWAY_REFERENCE" environment=production
          az storage blob download --auth-mode login --account-name "$GATEWAY_EVIDENCE_STORAGE_ACCOUNT" \
            --container-name "$GATEWAY_EVIDENCE_CONTAINER" --name "gateway-policy/sha256/${digest}.json" \
            --file downloaded-gateway-policy-export.json --overwrite
          cmp gateway-policy-export.json downloaded-gateway-policy-export.json
      - name: Create externally signed attestation
        shell: bash
        run: |
          set -euo pipefail
          signer_token="$(az account get-access-token --resource "$ZUKE_SIGNING_PROVIDER_AUDIENCE" --query accessToken --output tsv)"
          echo "::add-mask::$signer_token"
          export ZUKE_SIGNING_PROVIDER_URL="$ZUKE_SIGNING_PROVIDER_URL"
          export ZUKE_SIGNING_PROVIDER_BEARER_TOKEN="$signer_token"
          issued_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          expires_at="$(date -u -d '+90 days' +%Y-%m-%dT%H:%M:%SZ)"
          dart --suppress-analytics run zuke_cli:zuke attestation create \
            --root examples/calculator-product --provider-id provider.gateway.calculator-rate-limit \
            --evidence gateway-policy-export.json --reference "$GATEWAY_REFERENCE" \
            --signer-id attestation-signer-v1 --key-id "$ATTESTATION_SIGNER_KEY_ID" \
            --issued-at "$issued_at" --expires-at "$expires_at"
          dart --suppress-analytics run zuke_cli:zuke validate \
            --root examples/calculator-product --profile release --format json
      - name: Upload evidence and proposed attestation change
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gateway-attestation-${{ github.run_id }}
          retention-days: 90
          path: |
            gateway-policy-export.json
            examples/calculator-product/policies/attestations.yaml
            examples/calculator-product/assurance-history/attestations/
