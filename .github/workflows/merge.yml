name: merge

on:
  push:
    branches: [main]

jobs:
  shopping-cart-assurance:
    uses: ./.github/workflows/flutter-example-assurance.yml
    with:
      profile: merge
      changed-since: ${{ github.event.before }}
      example-root: examples/shopping_cart
      package-name: shopping_cart
      require-history: false
  todo-app-assurance:
    uses: ./.github/workflows/flutter-example-assurance.yml
    with:
      profile: merge
      changed-since: ${{ github.event.before }}
      example-root: examples/todo_app
      package-name: todo_app
      require-history: false
  assurance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      ZUKE_RUN_PROCESS_INTEGRATION: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: dart --suppress-analytics pub get
      - name: Prepare Flutter tool package
        run: dart --suppress-analytics run tool/prepare_flutter_toolchain.dart
      - run: dart --suppress-analytics format --output=none --set-exit-if-changed vendor-sdk examples/calculator-product
      - run: dart --suppress-analytics run melos run docs:check
      - run: dart --suppress-analytics run melos exec --no-flutter -- dart --suppress-analytics analyze
      - run: flutter --suppress-analytics analyze examples/calculator-product/apps/calculator_mobile
      - run: flutter --suppress-analytics test
        working-directory: examples/calculator-product/apps/calculator_mobile
      - run: dart --suppress-analytics analyze
        working-directory: examples/calculator-product/apps/calculator_api
      - name: Demonstrate local calculator rate limiting
        shell: bash
        working-directory: examples/calculator-product/apps/calculator_api
        run: dart --suppress-analytics run bin/rate_limit_demo.dart >> "$GITHUB_STEP_SUMMARY"
      - run: dart --suppress-analytics run zuke_cli:zuke check --root examples/calculator-product --profile merge --jobs 1 --format json
      - run: dart --suppress-analytics run zuke_cli:zuke manifest verify-v2 --root examples/calculator-product
      - name: Coverage check
        run: dart --suppress-analytics run melos run coverage:check
      - name: Stale-lock probe (temp fixture)
        if: runner.os != 'Windows'
        run: |
          mkdir -p /tmp/stale-probe/specs/features
          cat > /tmp/stale-probe/zuke.yaml << 'EOF'
          schemaVersion: 2
          workspace:
            name: stale-probe
            root: .
          specifications:
            features: [specs/features/**/*.feature]
          targets: {}
          EOF
          cat > /tmp/stale-probe/specs/features/test.feature << 'EOF'
          # spec-begin
          # schemaVersion: 1
          # id: FEAT-PROBE-001
          # spec-end
          Feature: Probe
            Scenario: probe
              Given a step
          EOF
          dart run zuke_cli:zuke lock --root /tmp/stale-probe --check && exit 1 || echo "Stale lock correctly detected"
      - name: Stale-lock probe (temp fixture, Windows)
        if: runner.os == 'Windows'
        run: |
          $dir = "$env:RUNNER_TEMP\stale-probe"
          New-Item -ItemType Directory -Path "$dir\specs\features" -Force | Out-Null
          Set-Content -Path "$dir\zuke.yaml" -Value @'
          schemaVersion: 2
          workspace:
            name: stale-probe
            root: .
          specifications:
            features: [specs/features/**/*.feature]
          targets: {}
          '@
          Set-Content -Path "$dir\specs\features\test.feature" -Value @'
          # spec-begin
          # schemaVersion: 1
          # id: FEAT-PROBE-001
          # spec-end
          Feature: Probe
            Scenario: probe
              Given a step
          '@
          dart run zuke_cli:zuke lock --root $dir --check
          if ($LASTEXITCODE -eq 0) { exit 1 } else { echo "Stale lock correctly detected" }
      - name: Process-tree integration test
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: dart test vendor-sdk/zuke_cli/test/process_supervisor_integration_test.dart
      - name: Process-tree integration test (Windows)
        if: runner.os == 'Windows'
        run: dart test vendor-sdk/zuke_cli/test/process_supervisor_integration_test.dart
      - name: Upload assurance artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: zuke-assurance-${{ matrix.os }}
          path: |
            examples/calculator-product/generated/
            examples/calculator-product/zuke.lock.json
            examples/calculator-product/assurance-history/
            vendor-sdk/*/coverage/lcov.info
            examples/calculator-product/**/coverage/lcov.info
