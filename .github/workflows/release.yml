name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  shopping-cart-assurance:
    uses: ./.github/workflows/flutter-example-assurance.yml
    with:
      profile: release
      changed-since: ${{ github.event.before }}
      example-root: examples/shopping_cart
      package-name: shopping_cart
      require-history: false
  todo-app-assurance:
    uses: ./.github/workflows/flutter-example-assurance.yml
    with:
      profile: merge
      changed-since: ${{ github.event.before }}
      example-root: examples/todo_app
      package-name: todo_app
      require-history: false
  calculator-product-assurance:
    uses: ./.github/workflows/calculator-product-assurance.yml
    with:
      profile: release
      prepare_lock: true
      demonstrate_rate_limit: true
  release-sign:
    needs: [calculator-product-assurance, shopping-cart-assurance, todo-app-assurance]
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: zuke-calculator-product-assurance-ubuntu-latest
          path: .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: shopping-cart-assurance-ubuntu-latest
          path: .
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter --suppress-analytics pub get
      - name: Prepare Flutter tool package
        run: dart --suppress-analytics run tool/prepare_flutter_toolchain.dart
      - name: Obtain short-lived Azure signer token through GitHub OIDC
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ZUKE_SIGNING_PROVIDER_AUDIENCE: ${{ vars.ZUKE_SIGNING_PROVIDER_AUDIENCE }}
          ZUKE_SIGNING_PROVIDER_URL: ${{ vars.ZUKE_SIGNING_PROVIDER_URL }}
        run: |
          : "${AZURE_CLIENT_ID:?release-signing AZURE_CLIENT_ID is required}"
          : "${AZURE_TENANT_ID:?release-signing AZURE_TENANT_ID is required}"
          : "${ZUKE_SIGNING_PROVIDER_AUDIENCE:?release-signing ZUKE_SIGNING_PROVIDER_AUDIENCE is required}"
          : "${ZUKE_SIGNING_PROVIDER_URL:?release-signing ZUKE_SIGNING_PROVIDER_URL is required}"
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange"
          oidc_token="$(curl --fail-with-body -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$oidc_url" | jq -r .value)"
          test -n "$oidc_token" && test "$oidc_token" != null
          az login --service-principal --tenant "$AZURE_TENANT_ID" --username "$AZURE_CLIENT_ID" --federated-token "$oidc_token" --allow-no-subscriptions >/dev/null
          signer_token="$(az account get-access-token --resource "$ZUKE_SIGNING_PROVIDER_AUDIENCE" --query accessToken --output tsv)"
          echo "::add-mask::$signer_token"
          echo "ZUKE_SIGNING_PROVIDER_URL=$ZUKE_SIGNING_PROVIDER_URL" >> "$GITHUB_ENV"
          echo "ZUKE_SIGNING_PROVIDER_BEARER_TOKEN=$signer_token" >> "$GITHUB_ENV"
      - name: Revalidate authoritative evidence
        run: |
          dart --suppress-analytics run zuke_cli:zuke validate --root examples/calculator-product --profile release --format json
          dart --suppress-analytics run zuke_cli:zuke lock --root examples/calculator-product --profile release --check
          dart --suppress-analytics run zuke_cli:zuke gate --root examples/calculator-product --all-profiles --format json
          dart --suppress-analytics run zuke_cli:zuke validate --root examples/shopping_cart --profile release --format json
          dart --suppress-analytics run zuke_cli:zuke lock --root examples/shopping_cart --profile release --check
          dart --suppress-analytics run zuke_cli:zuke gate --root examples/shopping_cart --all-profiles --format json
      - name: Create and verify signed release record
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          dart --suppress-analytics run zuke_cli:zuke manifest create --root examples/calculator-product --signer-id calculator-release-signer-v1 --key-id "${{ vars.RELEASE_SIGNER_KEY_ID }}"
          dart --suppress-analytics run zuke_cli:zuke manifest verify --root examples/calculator-product --current
          dart --suppress-analytics run zuke_cli:zuke manifest export --root examples/calculator-product --output dist/zuke-calculator-assurance-history.json
          dart --suppress-analytics run zuke_cli:zuke manifest create --root examples/shopping_cart --profile release --signer-id shopping-cart-release-signer-v1 --key-id "${{ vars.RELEASE_SIGNER_KEY_ID }}"
          dart --suppress-analytics run zuke_cli:zuke manifest verify --root examples/shopping_cart --current
          dart --suppress-analytics run zuke_cli:zuke manifest export --root examples/shopping_cart --output dist/zuke-shopping-cart-assurance-history.json
      - name: Upload signed assurance history
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zuke-signed-assurance-release
          retention-days: 90
          path: |
            examples/calculator-product/assurance-history/records/
            dist/zuke-calculator-assurance-history.json
            examples/shopping_cart/assurance-history/records/
            dist/zuke-shopping-cart-assurance-history.json
