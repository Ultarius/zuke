include: package:flutter_lints/flutter.yaml

# Flutter package variant of the workspace root options: same plugin block so
# nested analysis contexts still load zuke_analyzer (plugins cannot be declared
# in package-local analysis_options files).
plugins:
  zuke_analyzer:
    path: vendor-sdk/zuke_analyzer
    diagnostics:
      zuke_annotation: true
      zuke_index_stale: true
      zuke_unknown_index_id: true
      zuke_missing_test: true
      zuke_unimplemented_requirement: true
      zuke_spec_lint: true
  # The plugin would otherwise take these from pub.dev, where a release's new
  # dependency floors do not exist until it has been published.
  dependency_overrides:
    zuke:
      path: vendor-sdk/zuke
    zuke_annotations:
      path: vendor-sdk/zuke_annotations
    zuke_core:
      path: vendor-sdk/zuke_core
    zuke_frontend:
      path: vendor-sdk/zuke_frontend
