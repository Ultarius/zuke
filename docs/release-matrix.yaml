schemaVersion: 2
sdk:
  dart: '>=3.10.0 <4.0.0'
  analyzerMajors: [8, 9, 10, 11, 12, 13, 14]
  flutter: '3.44.x'
  test: '1.31.x'
  testApi: '0.7.x'
operatingSystems: [linux, windows]
packages:
  zuke_core:
    version: 0.3.0
    previousVersion: 0.2.0
    publish: true
    releaseAction: publish
    tier: Shared infrastructure
    supportStatement: Supported Zuke infrastructure dependency; applications normally use a primary SDK package.
    bumpReason: Breaking contract ownership and analyzer-free core boundary.
  zuke_annotations:
    version: 0.4.0
    previousVersion: 0.3.0
    publish: true
    releaseAction: publish
    tier: Narrow SDK
    supportStatement: Supported application-facing annotation API.
    bumpReason: Breaking removal of provider-owned workspace target metadata.
  zuke_frontend:
    version: 0.2.1
    previousVersion: 0.2.0
    publish: true
    releaseAction: publish
    tier: Narrow SDK
    supportStatement: Supported frontend and configuration API.
    bumpReason: Patch release for configured-target contract export discovery.
  zuke:
    version: 0.4.0
    previousVersion: 0.3.1
    publish: true
    releaseAction: publish
    tier: Primary SDK
    supportStatement: Primary pure-Dart Zuke SDK and supported current facade.
    bumpReason: Coordinated facade release for the provider target ownership migration.
  zuke_runner:
    version: 0.4.0
    previousVersion: 0.3.1
    publish: true
    releaseAction: publish
    tier: Compatibility
    supportStatement: Compatibility package for the primary Zuke SDK.
    bumpReason: Coordinated runner release for the provider target ownership migration.
  zuke_runner_flutter:
    version: 0.4.0
    previousVersion: 0.3.1
    publish: true
    releaseAction: publish
    tier: Specialized SDK
    supportStatement: Supported Flutter testWidgets integration boundary.
    bumpReason: Coordinated Flutter runner release for the provider target ownership migration.
  zuke_http_runtime:
    version: 0.1.1
    previousVersion: 0.1.1
    publish: true
    releaseAction: reuse
    tier: Specialized SDK
    supportStatement: Supported application-facing HTTP runtime boundary.
    bumpReason: Existing hosted version remains compatible with this release.
  zuke_cli:
    version: 0.5.0
    previousVersion: 0.4.2
    publish: true
    releaseAction: publish
    tier: Specialized SDK
    supportStatement: Supported CLI for generation, extraction, validation, locks, and gates.
    bumpReason: Breaking target-aware extraction and proof-owner routing without provider target fallbacks.
  zuke_dart_build_hook:
    version: 0.4.0
    previousVersion: 0.3.0
    publish: true
    releaseAction: publish
    tier: Specialized SDK
    supportStatement: Supported optional package-owned build-time validation hook.
    bumpReason: Coordinated build-hook release for target-aware CLI extraction.
  zuke_analyzer:
    version: 0.1.0
    previousVersion: 0.1.0
    publish: false
    releaseAction: internal
    tier: Repository tooling
    supportStatement: Repository-only analyzer plugin; not published to pub.dev.
    bumpReason: Internal workspace tooling.
  zuke_conformance:
    version: 0.1.0
    previousVersion: 0.1.0
    publish: false
    releaseAction: internal
    tier: Repository tooling
    supportStatement: Repository-only conformance tooling; not published to pub.dev.
    bumpReason: Internal workspace tooling.
  zuke_test_support:
    version: 0.1.0
    previousVersion: 0.1.0
    publish: false
    releaseAction: internal
    tier: Repository tooling
    supportStatement: Repository-only test support; not published to pub.dev.
    bumpReason: Internal workspace tooling.
  zuke_verifier:
    version: 0.1.0
    previousVersion: 0.1.0
    publish: false
    releaseAction: internal
    tier: Repository tooling
    supportStatement: Repository-only verification tooling; not published to pub.dev.
    bumpReason: Internal workspace tooling.
retiredPackages:
  assurance_ir: Consolidated into current zuke_core contracts.
  adapter_sdk: Consolidated into zuke_core and zuke adapter facade.
  evidence_ledger: Consolidated into zuke_cli.
  dart_extractor: Consolidated into current zuke_cli tooling.
  proof_engine: Consolidated into zuke_cli proof engine.
  zuke_generator: Consolidated into zuke_cli generator.
  zuke_reporter: Consolidated into zuke_cli reporter.
  zuke_adapter_dart_frog: Consolidated into the zuke_cli Dart Frog adapter.
  zuke_flutter_runtime: Superseded by the hosted zuke_runner_flutter package.
compatibilityIds:
  dart-frog: dart-frog-gen-2-route-topology-v1
  dart-source: dart-source-package-v1
contracts:
  diagnostic: zuke.diagnostic-registry
  commandResult: zuke.command-result
  evidenceRecord: zuke.evidence-record
  lock: zuke.lock
publicationOrder:
  - zuke_core
  - zuke_annotations
  - zuke_frontend
  - zuke
  - zuke_runner
  - zuke_runner_flutter
  - zuke_cli
  - zuke_dart_build_hook
