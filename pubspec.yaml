name: zuke_workspace
description: Zuke specification and Zuke assurance workspace tooling.
publish_to: none
environment:
  sdk: '>=3.10.0 <4.0.0'
workspace:
  - vendor-sdk/zuke_core
  - vendor-sdk/zuke_conformance
  - vendor-sdk/zuke_analyzer
  - vendor-sdk/zuke_dart_build_hook
  - vendor-sdk/zuke_annotations
  - vendor-sdk/zuke_frontend
  - vendor-sdk/zuke_http_runtime
  - vendor-sdk/zuke
  - vendor-sdk/zuke_runner
  - vendor-sdk/zuke_runner_flutter
  - vendor-sdk/zuke_test_support
  - vendor-sdk/zuke_cli
  - vendor-sdk/zuke_verifier
  - examples/calculator-product/apps/calculator_api
  - examples/calculator-product/apps/calculator_mobile
  - examples/calculator-product/packages/calculator_contracts
  - examples/calculator-product/packages/calculator_domain
  - examples/shopping_cart
  - examples/todo_app
dev_dependencies:
  melos: ^6.3.0
  zuke_cli: ^0.5.0
  zuke_analyzer: ^0.1.0
  yaml: ^3.1.3
dependency_overrides:
  # The repository analyzer plugin follows the Flutter SDK's embedded
  # analyzer, while published zuke_core resolves the current analyzer.
  analyzer: 8.2.0
  # Flutter 3.44 pins test_api 0.7.11; keep the workspace's Dart test runner
  # on the matching test release while the SDK constraint remains shared.
  test: 1.31.0
